<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; --bg:#fbfbfd; --label:#1d1d1f; --sec:#6e6e73; --blue:#0a84ff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --label:#f5f5f7; --sec:#98989d; } }
    * { box-sizing: border-box; }
    body { width: 300px; margin: 0; padding: 22px 20px 20px; background: var(--bg); color: var(--label);
           font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
           -webkit-font-smoothing: antialiased; text-align: center; }
    .icon { width: 64px; height: 64px; border-radius: 15px; margin: 0 auto 14px;
            background: linear-gradient(160deg, #ff6a5f, #ff2d55); display: grid; place-items: center;
            box-shadow: 0 8px 20px rgba(255,45,85,.35); }
    h1 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; }
    p { font-size: 12.5px; color: var(--sec); margin: 0 0 16px; line-height: 1.4; }
    button { width: 100%; border: 0; border-radius: 12px; padding: 11px 14px; font: inherit; font-size: 14px; font-weight: 600;
             color: #fff; background: var(--blue); cursor: pointer; transition: transform .1s, opacity .2s; }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 10px; font-size: 12px; color: var(--sec); min-height: 16px; }
  </style>
</head>
<body>
  <div class="icon">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h12M4 12h12M4 17h7"/><path d="M17 14l5 3-5 3z" fill="#fff" stroke="none"/></svg>
  </div>
  <h1>Turbo Playlist Remover</h1>
  <p>Load all your playlists, pick the ones to remove, and delete them with live progress.</p>
  <button id="go">Open</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
